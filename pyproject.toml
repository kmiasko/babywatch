[project]
name = "babywatch"
version = "0.1.0"
description = "Notify when a baby sits or stands in the crib (nanny-cam RTSP stream), suppressed while an adult is in view"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.15",
    "opencv-python>=4.10",
    "av>=13",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pyyaml>=6",
    "joblib>=1.4",
    "pillow>=10",
    "ultralytics>=8.3",
]

[project.scripts]
babywatch = "babywatch.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babywatch"]

[tool.hatch.build.targets.sdist]
include = ["src/babywatch", "docs", "README.md", "pyproject.toml", "requirements.lock"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
